# tiger (ck3-tiger / vic3-tiger) configuration for the Warhammer Fantasy Overhaul.
#
# Adapted from Realms of Exether's proven 1.13 config, trimmed to THIS mod's
# replace_paths set and stripped of Exether-specific content exceptions.
#
# Status: committed in P1, but NOT yet wired into the workflow — P1–P3 touch no
# game-read files, so there is nothing here for tiger to lint. It goes live from
# P4 onward (once replace_paths + the scaffold land). Add new suppressions here
# only as real content lands and tiger surfaces a genuine false positive; do not
# pre-populate speculative exceptions.

languages = {
	check = "english"
}

filter = {
	trigger = {
		severity >= "error"
		NOR = {
			# Art assets are validated by the game, not by tiger.
			file = "gfx/*"

			# "prefixes" warnings fire because we REPLACE vanilla files in these
			# directories (via .metadata/metadata.json replace_paths) and the
			# replacement deliberately drops vanilla's prefixed entries. This is
			# expected for every replaced directory — mirrors the mod's
			# replace_paths final list (see planning/requests/world-map.md).
			AND = {
				key = "prefixes"
				OR = {
					file = "map_data/state_regions/*"
					file = "common/strategic_regions/*"
					file = "common/geographic_regions/*"
					file = "common/country_definitions/*"
					file = "common/country_creation/*"
					file = "common/country_formation/*"
					file = "common/history/*"
					file = "common/history/ai/*"
					file = "common/history/buildings/*"
					file = "common/history/characters/*"
					file = "common/history/conscription/*"
					file = "common/history/countries/*"
					file = "common/history/cultures/*"
					file = "common/history/diplomacy/*"
					file = "common/history/diplomatic_plays/*"
					file = "common/history/global/*"
					file = "common/history/governments/*"
					file = "common/history/government_setup/*"
					file = "common/history/lobbies/*"
					file = "common/history/military_deployments/*"
					file = "common/history/military_formations/*"
					file = "common/history/political_movements/*"
					file = "common/history/pops/*"
					file = "common/history/population/*"
					file = "common/history/power_blocs/*"
					file = "common/history/production_methods/*"
					file = "common/history/states/*"
					file = "common/history/trade/*"
					file = "common/history/treaties/*"
					file = "common/decisions/*"
					file = "common/journal_entries/*"
					file = "common/achievements/*"
					file = "common/ai_strategies/*"
					file = "common/company_types/*"
					file = "common/dynamic_country_map_colors/*"
					file = "common/dynamic_country_names/*"
					file = "common/flag_definitions/*"
					file = "common/coat_of_arms/coat_of_arms/*"
					file = "common/ship_name_definitions/*"
					file = "common/scripted_tests/*"
					file = "common/scripted_buttons/*"
					file = "common/scripted_progress_bars/*"
					file = "events/**/*"
				}
			}

			# Building groups are valid as capped_resources through 1.13 — tiger
			# 1.12.x flags them as missing item types. Our state files use them.
			AND = {
				key = "missing-item"
				text = "building type bg_"
			}

			# create_pop `size` accepts a math-expression block; tiger reads the
			# block as a structure error. Vanilla history/pops and on_actions do it.
			AND = {
				key = "structure"
				text = "expected value, found block"
				OR = {
					file = "common/history/pops/*"
					file = "common/on_actions/*"
				}
			}

			# CoA @[macro] position expressions are resolved at runtime.
			AND = {
				key = "validation"
				file = "common/coat_of_arms/coat_of_arms/*"
				text = "expected 2 numbers"
			}

			# scope:X variable references are populated by the engine at runtime;
			# tiger cannot statically resolve them.
			AND = {
				OR = {
					key = "unknown-field"
					key = "missing-item"
				}
				text = "scope:"
			}
		}
	}
}
