 # Per-name display keys for every name string used in common/cultures/*.txt.
 # Names are global in Victoria 3, not per-culture: this one shared file carries a key for
 # every unique name in the mod, and is APPENDED to by each culture-authoring item in epic
 # #3404 (#3406, #3407, #3408, #3409) — never recreated per culture file.
 # Board item #3407 (epic #3404).
 # Before adding a name here, check that vanilla's localization/english/names_l_english.yml
 # (which this mod loads unmodified) does not already ship that exact key — and likewise any
 # future localization/replace/english/ override of it. A key defined in both places is a
 # duplicate-key error in the game log. This file carries ONLY names vanilla does not already
 # provide a display key for; names that vanilla already keys stay in the culture's name lists
 # in common/cultures/*.txt but get no entry here.

